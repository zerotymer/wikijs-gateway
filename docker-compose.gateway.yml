services:
  wikijs-agent-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - gateway-audit:/audit
    environment:
      WIKIJS_GRAPHQL_URL: ${WIKIJS_GRAPHQL_URL:-http://wiki:3000/graphql}
      WIKIJS_API_TOKEN: ${WIKIJS_API_TOKEN}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN}
      AUDIT_DIR: ${AUDIT_DIR:-/audit}
      RENDER_AFTER_WRITE: ${RENDER_AFTER_WRITE:-false}
      # Rust image only; ignored by the Python image. See .env.example.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    restart: unless-stopped

volumes:
  gateway-audit:
